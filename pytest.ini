[pytest]
testpaths = tests
addopts = -v --tb=short
markers =
    smoke: quick sanity checks (run first)
    regression: full regression suite
    bbps: BBPS feature tests
    discovery: biller category and biller discovery
    bill_fetch: validate-account and fetch-bill flow
    order: order creation and management
    prepaid: prepaid/recharge flow
    bill_actions: mark-paid, deactivate-account, dashboard
    negative: error and edge-case scenarios
    destructive: tests that mutate shared state (deactivate-account etc.) — run carefully
    juspay: tests for billers that have Juspay in supported_providers